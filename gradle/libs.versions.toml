# Gradle Version Catalog for NeoProCamX
# Centralized dependency management for build consistency

[versions]
# Kotlin & Gradle (Section 1.1)
kotlin = "2.3.21"
agp = "9.2.0"

# AndroidX Core
androidx-core = "1.17.0"
androidx-core-splashscreen = "1.0.1"
androidx-activity = "1.12.4"
androidx-appcompat = "1.7.1"
androidx-constraintlayout = "2.2.1"
androidx-lifecycle = "2.10.0"
androidx-navigation = "2.9.8"
androidx-preference = "1.2.1"
androidx-recyclerview = "1.4.0"
androidx-window = "1.4.0"
androidx-exifinterface = "1.4.1"

# Camera
androidx-camera = "1.6.1"

# Compose (if used in future)
compose = "1.9.4"

# Coroutines (Section 1.3)
kotlinx-coroutines = "1.10.2"
okhttp = "5.3.0"
play-integrity = "1.6.0"

# Media3 / ExoPlayer for Media Preview (Section 14)
media3 = "1.9.4"

# Google Services
material = "1.13.0"
glide = "5.0.7"

# ML & AI
mediapipe = "0.10.35"
protobuf-javalite = "4.27.5"
mlkit-face = "16.1.7"
mlkit-object = "17.0.2"
mlkit-labeling = "17.0.9"
litert = "1.4.2"

# Build-only dependency security floors. These are strict constraints in app/build.gradle.
guava-annotation-processor = "33.3.1-android"

# Testing
junit = "4.13.2"
androidx-test-core = "1.7.0"
androidx-test-runner = "1.7.0"
androidx-test-rules = "1.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-orchestrator = "1.5.1"
androidx-test-services = "1.5.0"

[libraries]
# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
playIntegrity = { module = "com.google.android.play:integrity", version.ref = "play-integrity" }

# AndroidX Core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-core-splashscreen" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidx-activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintlayout" }

# AndroidX Lifecycle
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }

# AndroidX Navigation
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "androidx-navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "androidx-navigation" }

# AndroidX Other
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "androidx-preference" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recyclerview" }
androidx-window = { module = "androidx.window:window", version.ref = "androidx-window" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidx-exifinterface" }

# Camera
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "androidx-camera" }

# Google Services
google-material = { module = "com.google.android.material:material", version.ref = "material" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }

# ML & AI
mediapipe-tasks-vision = { module = "com.google.mediapipe:tasks-vision", version.ref = "mediapipe" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf-javalite" }
mlkit-face-detection = { module = "com.google.mlkit:face-detection", version.ref = "mlkit-face" }
mlkit-object-detection = { module = "com.google.mlkit:object-detection", version.ref = "mlkit-object" }
mlkit-image-labeling = { module = "com.google.mlkit:image-labeling", version.ref = "mlkit-labeling" }
tensorflow-lite = { module = "com.google.ai.edge.litert:litert", version.ref = "litert" }
tensorflow-lite-gpu = { module = "com.google.ai.edge.litert:litert-gpu", version.ref = "litert" }

# Host annotation-processor graph only; never packaged into the APK.
guava-annotation-processor = { module = "com.google.guava:guava", version.ref = "guava-annotation-processor" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test-rules" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-orchestrator = { module = "androidx.test:orchestrator", version.ref = "androidx-test-orchestrator" }
androidx-test-services = { module = "androidx.test.services:test-services", version.ref = "androidx-test-services" }

# Media3 / ExoPlayer (Section 14: Media Preview redesign)
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }

[bundles]
androidx-lifecycle = [
    "androidx-lifecycle-livedata-ktx",
    "androidx-lifecycle-viewmodel-ktx",
    "androidx-lifecycle-runtime-ktx"
]
androidx-navigation = [
    "androidx-navigation-fragment-ktx",
    "androidx-navigation-ui-ktx"
]
mlkit = [
    "mlkit-face-detection",
    "mlkit-object-detection",
    "mlkit-image-labeling"
]
tensorflow = [
    "tensorflow-lite",
    "tensorflow-lite-gpu"
]
androidx-testing = [
    "androidx-test-core-ktx",
    "androidx-test-runner",
    "androidx-test-rules",
    "androidx-test-ext-junit"
]
media3 = [
    "media3-exoplayer",
    "media3-ui",
    "media3-common",
    "media3-session"
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
