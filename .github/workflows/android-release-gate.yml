name: Android release gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_device_lab:
        description: Run connected physical-camera and performance gates
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NEOPROCAMX_KEYSTORE_FILE: ${{ github.workspace }}/keystore/release.jks
      NEOPROCAMX_KEYSTORE_PASSWORD: ${{ secrets.NEOPROCAMX_KEYSTORE_PASSWORD }}
      NEOPROCAMX_KEY_ALIAS: ${{ secrets.NEOPROCAMX_KEY_ALIAS }}
      NEOPROCAMX_KEY_PASSWORD: ${{ secrets.NEOPROCAMX_KEY_PASSWORD }}
      NEOPROCAMX_ALLOWED_CERT_SHA256: ${{ secrets.NEOPROCAMX_ALLOWED_CERT_SHA256 }}
      NEOPROCAMX_PLAY_APP_SIGNING_SHA256: ${{ secrets.NEOPROCAMX_PLAY_APP_SIGNING_SHA256 }}
      NEOPROCAMX_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ secrets.NEOPROCAMX_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NEOPROCAMX_KEYSTORE_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android toolchain
        run: >-
          sdkmanager
          "platform-tools"
          "platforms;android-36.1"
          "build-tools;36.1.0"
          "ndk;29.0.14206865"
          "cmake;3.22.1"

      - name: Test, lint, and build debug verification artifact
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease assembleDebug --warning-mode all --console=plain

      - name: Upload verification reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-gate-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-release.*
            app/build/test-results/testDebugUnitTest/
            app/build/outputs/apk/debug/*.apk

  signed-release:
    if: ${{ github.event_name != 'pull_request' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      NEOPROCAMX_KEYSTORE_FILE: ${{ github.workspace }}/keystore/release.jks
      NEOPROCAMX_KEYSTORE_PASSWORD: ${{ secrets.NEOPROCAMX_KEYSTORE_PASSWORD }}
      NEOPROCAMX_KEY_ALIAS: ${{ secrets.NEOPROCAMX_KEY_ALIAS }}
      NEOPROCAMX_KEY_PASSWORD: ${{ secrets.NEOPROCAMX_KEY_PASSWORD }}
      NEOPROCAMX_ALLOWED_CERT_SHA256: ${{ secrets.NEOPROCAMX_ALLOWED_CERT_SHA256 }}
      NEOPROCAMX_PLAY_APP_SIGNING_SHA256: ${{ secrets.NEOPROCAMX_PLAY_APP_SIGNING_SHA256 }}
      NEOPROCAMX_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ secrets.NEOPROCAMX_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NEOPROCAMX_KEYSTORE_BASE64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android toolchain
        run: >-
          sdkmanager
          "platform-tools"
          "platforms;android-36.1"
          "build-tools;36.1.0"
          "ndk;29.0.14206865"
          "cmake;3.22.1"

      - name: Require production release credentials
        shell: bash
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$NEOPROCAMX_KEYSTORE_PASSWORD"
          test -n "$NEOPROCAMX_KEY_ALIAS"
          test -n "$NEOPROCAMX_KEY_PASSWORD"
          test -n "$NEOPROCAMX_ALLOWED_CERT_SHA256"
          test -n "$NEOPROCAMX_PLAY_APP_SIGNING_SHA256"

      - name: Materialize release key
        run: |
          mkdir -p keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks

      - name: Build signed release artifacts
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --warning-mode all --console=plain

      - name: Verify APK and bundle signatures
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' -type f -print -quit)"
          test -n "$APK" && test -n "$AAB"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$APK"
          jarsigner -verify -strict -verbose "$AAB"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-android-release-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/

  physical-device-gate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_device_lab }}
    needs: verify
    runs-on: [self-hosted, Windows, android-camera-lab]
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Require exactly one authorized Android target
        shell: powershell
        run: |
          $devices = @(adb devices | Select-String "`tdevice$")
          if ($devices.Count -ne 1) { throw "Expected exactly one authorized target; found $($devices.Count)" }

      - name: Build, install, and run instrumented camera contracts
        shell: powershell
        run: .\gradlew.bat assembleDebug connectedDebugAndroidTest --warning-mode all --console=plain

      - name: Run physical camera lifecycle and recording QA
        shell: powershell
        run: >-
          powershell -ExecutionPolicy Bypass -File .\tools\adb_camera_qa.ps1
          -CaptureStressCount 20 -LongRunCaptureCount 100 -VideoRecordDurationSec 15
          -SkipLowStorage -SkipLowBattery -SkipIncomingCall

      - name: Run encoder cadence and performance evidence gate
        shell: powershell
        run: >-
          powershell -ExecutionPolicy Bypass
          -File .\tools\quality\run-v16-real-device-encoder-validation.ps1
          -MaxRows 4 -IsolateRows

      - name: Upload physical-device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-camera-gate-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            tools/reports/
            qa-artifacts/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
