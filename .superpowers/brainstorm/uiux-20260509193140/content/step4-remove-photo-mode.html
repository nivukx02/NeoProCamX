<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeoProCamX Modes Without Photo</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #090909;
      overflow: hidden;
    }

    iframe {
      width: min(430px, 100vw);
      height: min(932px, 100vh);
      border: 0;
      background: #000;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="layout" src="/files/step3-clean-display-sensor-info-only.html" title="NeoProCamX clean display without Photo mode"></iframe>
  <script>
    const frame = document.getElementById('layout');

    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      const photo = Array.from(doc.querySelectorAll('.mode'))
        .find((item) => item.textContent.trim() === 'PHOTO');

      if (photo) {
        photo.remove();
      }

      const row = doc.querySelector('.mode-row');
      if (row) {
        row.style.justifyContent = 'center';
        row.style.gap = '22px';
        row.style.padding = '0 38px';
      }
    });
  </script>
</body>
</html>
