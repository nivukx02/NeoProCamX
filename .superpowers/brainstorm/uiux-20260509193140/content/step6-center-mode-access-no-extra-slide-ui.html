<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeoProCamX Center Mode Access</title>
  <style>
    :root {
      color-scheme: dark;
      --yellow: #ffd21c;
      --white: #f8f8f8;
      --record: #ff2d2d;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #090909;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);
    }

    .phone {
      width: min(430px, 100vw);
      height: min(932px, 100vh);
      position: relative;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
    }

    .preview {
      position: absolute;
      inset: 0 0 184px;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 22%, rgba(172,188,175,.36), transparent 28%),
        radial-gradient(circle at 57% 44%, rgba(85,101,86,.42), transparent 34%),
        linear-gradient(126deg, #637269 0%, #26342f 43%, #080908 78%, #020202 100%);
    }

    .preview::before {
      content: "";
      position: absolute;
      inset: -50px;
      background:
        repeating-linear-gradient(116deg, transparent 0 14px, rgba(10,20,17,.36) 15px 19px, transparent 20px 36px),
        linear-gradient(90deg, rgba(0,0,0,.05), rgba(0,0,0,.48));
      opacity: .85;
      filter: blur(.4px);
    }

    .preview::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.4), transparent 20%, transparent 68%, rgba(0,0,0,.72));
    }

    .sensor-info {
      position: absolute;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      z-index: 4;
      min-width: 262px;
      height: 34px;
      padding: 0 13px;
      display: grid;
      grid-template-columns: auto auto auto;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #fff;
      background: rgba(0,0,0,.34);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      backdrop-filter: blur(8px);
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .sensor-info span + span {
      position: relative;
    }

    .sensor-info span + span::before {
      content: "";
      position: absolute;
      left: -7px;
      top: 50%;
      width: 1px;
      height: 12px;
      transform: translateY(-50%);
      background: rgba(255,255,255,.32);
    }

    .pro-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 146px;
      height: 184px;
      z-index: 5;
      overflow: hidden;
      background: linear-gradient(90deg, rgba(24,38,35,.62), rgba(6,8,7,.2) 44%, rgba(0,0,0,.72));
      border-top: 1px solid rgba(255,255,255,.08);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .pro-overlay svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .adjust-scroll {
      position: absolute;
      left: 18.5%;
      right: 5%;
      top: 19%;
      height: 18%;
      overflow-x: auto;
      opacity: .01;
      scrollbar-width: none;
    }

    .adjust-scroll::-webkit-scrollbar { display: none; }
    .scroll-content { width: 180%; height: 100%; }

    .bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 184px;
      z-index: 6;
      background: #050505;
      border-top: 1px solid rgba(255,255,255,.08);
      display: grid;
      grid-template-rows: 52px 1fr;
    }

    .mode-row {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 22px;
      overflow-x: auto;
      padding: 0 calc(50% - 42px);
      scrollbar-width: none;
      white-space: nowrap;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
    }

    .mode-row::-webkit-scrollbar { display: none; }

    .mode {
      flex: 0 0 84px;
      height: 32px;
      border-radius: 16px;
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.62);
      font: 700 13px/1 Arial, Helvetica, sans-serif;
      letter-spacing: 0;
      scroll-snap-align: center;
      transition: transform .2s ease, color .2s ease, background .2s ease;
    }

    .mode.is-active {
      transform: scale(1.08);
      color: #111;
      background: #fff;
      font-size: 14px;
      animation: modePop .22s ease;
    }

    @keyframes modePop {
      0% { transform: scale(.96); }
      72% { transform: scale(1.12); }
      100% { transform: scale(1.08); }
    }

    .controls {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 118px 1fr;
      align-items: center;
      padding: 4px 28px 22px;
    }

    .thumb {
      width: 50px;
      height: 50px;
      justify-self: start;
      border-radius: 13px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.9), rgba(255,255,255,.22)),
        linear-gradient(120deg, #607267, #111);
      border: 2px solid rgba(255,255,255,.78);
    }

    .shutter {
      width: 92px;
      height: 92px;
      justify-self: center;
      border-radius: 50%;
      border: 5px solid #fff;
      display: grid;
      place-items: center;
      background: transparent;
      position: relative;
      transition: border-color .18s ease, transform .18s ease;
    }

    .shutter::before {
      content: "";
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.08);
      transition: width .22s ease, height .22s ease, border-radius .22s ease, background .18s ease;
    }

    .shutter::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid transparent;
      pointer-events: none;
    }

    .shutter.is-recording {
      border-color: rgba(255,255,255,.92);
      transform: scale(.96);
    }

    .shutter.is-recording::before {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--record);
    }

    .shutter.is-recording::after {
      border-color: rgba(255,45,45,.8);
      animation: recordPulse 1.15s ease-out infinite;
    }

    @keyframes recordPulse {
      0% { transform: scale(.88); opacity: .82; }
      100% { transform: scale(1.18); opacity: 0; }
    }

    .switch {
      width: 54px;
      height: 54px;
      justify-self: end;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.16);
    }

    .switch svg {
      width: 28px;
      height: 28px;
      stroke: #fff;
      fill: none;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="NeoProCamX center mode access">
    <section class="preview">
      <div class="sensor-info" aria-label="Sensor size, resolution, and aspect ratio">
        <span>1/1.31"</span>
        <span>8192x6144</span>
        <span>4:3</span>
      </div>
    </section>

    <section class="pro-overlay" aria-label="Approved Pro controller overlay">
      <svg viewBox="0 0 1064 476" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <style>
            .w { fill: #f8f8f8; }
            .s { stroke: #f8f8f8; stroke-width: 5.2; fill: none; stroke-linecap: square; stroke-linejoin: round; }
            .t { stroke: rgba(255,255,255,.92); stroke-width: 4; stroke-linecap: square; }
            .y { fill: #ffd21c; }
            .ys { stroke: #ffd21c; stroke-width: 5.2; fill: none; stroke-linejoin: round; }
            .dim { fill: rgba(255,255,255,.34); }
            .dims { stroke: rgba(255,255,255,.34); stroke-width: 5.2; fill: none; stroke-linecap: round; }
          </style>
        </defs>
        <line x1="352" y1="0" x2="352" y2="476" stroke="rgba(255,255,255,.24)" stroke-width="1.5"/>
        <line x1="724" y1="0" x2="724" y2="476" stroke="rgba(255,255,255,.24)" stroke-width="1.5"/>
        <circle cx="99" cy="135" r="30" class="w"/>
        <text x="99" y="149" fill="#2f2f2f" font-size="47" font-weight="800" text-anchor="middle">A</text>
        <text x="101" y="205" class="w" font-size="30" text-anchor="middle">Manual</text>
        <text x="536" y="58" class="w" font-size="39" text-anchor="middle">500</text>
        <line x1="217" y1="114" x2="217" y2="139" class="t"/><line x1="264" y1="112" x2="264" y2="141" class="t"/><line x1="312" y1="111" x2="312" y2="141" class="t"/><line x1="363" y1="112" x2="363" y2="140" class="t"/><line x1="415" y1="111" x2="415" y2="141" class="t"/><line x1="467" y1="113" x2="467" y2="139" class="t"/><line x1="536" y1="92" x2="536" y2="157" stroke="#ffd21c" stroke-width="7"/><line x1="595" y1="112" x2="595" y2="141" class="t"/><line x1="647" y1="113" x2="647" y2="139" class="t"/><line x1="700" y1="111" x2="700" y2="141" class="t"/><line x1="763" y1="112" x2="763" y2="141" class="t"/><line x1="813" y1="113" x2="813" y2="139" class="t"/><line x1="860" y1="113" x2="860" y2="139" class="t"/>
        <text x="369" y="195" class="w" font-size="31" text-anchor="middle">250</text>
        <text x="705" y="195" class="w" font-size="31" text-anchor="middle">1000</text>
        <path d="M51 288 H101 V340 H51 Z" class="s"/><line x1="52" y1="340" x2="101" y2="289" class="s"/><text x="64" y="306" class="w" font-size="29" font-weight="800" text-anchor="middle">+</text><text x="87" y="333" class="w" font-size="29" font-weight="800" text-anchor="middle">-</text><text x="78" y="393" class="w" font-size="31" text-anchor="middle">0</text>
        <rect x="227" y="289" width="58" height="50" rx="2" class="ys"/><text x="256" y="317" class="y" font-size="31" font-weight="700" text-anchor="middle">ISO</text><text x="256" y="394" class="y" font-size="31" text-anchor="middle">500</text>
        <rect x="411" y="289" width="58" height="50" rx="2" class="s"/><text x="440" y="317" class="w" font-size="31" font-weight="700" text-anchor="middle">S</text><text x="440" y="394" class="w" font-size="31" text-anchor="middle">0.4</text>
        <rect x="595" y="289" width="58" height="50" rx="2" class="s"/><text x="624" y="317" class="w" font-size="31" font-weight="700" text-anchor="middle">WB</text><path d="M609 390 C610 382 617 379 623 382 C626 375 637 377 639 386 C645 386 650 390 650 396 C650 402 645 405 638 405 H614 C608 405 604 401 604 396 C604 392 606 390 609 390 Z" fill="none" stroke="#f8f8f8" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="811" cy="314" r="27" class="dims"/><circle cx="811" cy="314" r="10" class="dims"/><text x="811" y="394" class="dim" font-size="31" text-anchor="middle">AF</text>
        <path d="M967 292 H991 M1013 292 H1037 M967 339 H991 M1013 339 H1037" stroke="#f8f8f8" stroke-width="8"/><path d="M967 292 V312 M1037 292 V312 M967 339 V319 M1037 339 V319" stroke="#f8f8f8" stroke-width="8"/><circle cx="1002" cy="316" r="21" fill="#f8f8f8"/><circle cx="1002" cy="316" r="8" fill="#030303"/><rect x="987" y="378" width="31" height="23" rx="1.5" class="s" stroke-width="3.2"/>
      </svg>
      <div class="adjust-scroll" aria-label="Scrollable adjust bar">
        <div class="scroll-content"></div>
      </div>
    </section>

    <section class="bottom" aria-label="Mode and shutter controls">
      <nav class="mode-row" aria-label="Center mode selector">
        <button class="mode" type="button" data-mode="VIDEO">VIDEO</button>
        <button class="mode is-active" type="button" data-mode="PRO">PRO</button>
        <button class="mode" type="button" data-mode="HDR">HDR</button>
        <button class="mode" type="button" data-mode="LOG">LOG</button>
        <button class="mode" type="button" data-mode="RAW">RAW</button>
      </nav>
      <div class="controls">
        <div class="thumb" aria-label="Gallery thumbnail"></div>
        <button class="shutter" id="shutter" aria-label="Shutter"></button>
        <button class="switch" aria-label="Switch camera">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.7-4.4"/><path d="M4 7V3h4"/><path d="M4 13a8 8 0 0 0 14.7 4.4"/><path d="M20 17v4h-4"/></svg>
        </button>
      </div>
    </section>
  </main>

  <script>
    const row = document.querySelector('.mode-row');
    const modes = Array.from(document.querySelectorAll('.mode'));
    const shutter = document.getElementById('shutter');
    let snapTimer = 0;

    function setActiveMode(target) {
      modes.forEach((mode) => mode.classList.toggle('is-active', mode === target));
    }

    function centerMode(target, behavior = 'smooth') {
      const rowCenter = row.clientWidth / 2;
      const left = target.offsetLeft + target.offsetWidth / 2 - rowCenter;
      row.scrollTo({ left, behavior });
      setActiveMode(target);
    }

    function nearestMode() {
      const center = row.scrollLeft + row.clientWidth / 2;
      return modes.reduce((best, mode) => {
        const modeCenter = mode.offsetLeft + mode.offsetWidth / 2;
        const diff = Math.abs(modeCenter - center);
        return diff < best.diff ? { mode, diff } : best;
      }, { mode: modes[0], diff: Infinity }).mode;
    }

    row.addEventListener('scroll', () => {
      const active = nearestMode();
      setActiveMode(active);
      clearTimeout(snapTimer);
      snapTimer = setTimeout(() => centerMode(active), 120);
    }, { passive: true });

    modes.forEach((mode) => {
      mode.addEventListener('click', () => centerMode(mode));
    });

    shutter.addEventListener('click', () => {
      shutter.classList.toggle('is-recording');
    });

    requestAnimationFrame(() => {
      const pro = modes.find((mode) => mode.dataset.mode === 'PRO');
      centerMode(pro, 'auto');
    });
  </script>
</body>
</html>
